spring.application.name=gui
server.port=8090

# Host-mode default: run GUI on the VM/host while naming server is mapped to localhost:8080.
# Docker-compose mode can override this with GUI_NAMING_SERVER_URL=http://naming-server:8080/api
gui.naming-server-base-url=${GUI_NAMING_SERVER_URL:http://localhost:8080/api}
gui.node-api-port=${GUI_NODE_API_PORT:8080}

# Add/remove node support. Best when the GUI is run on the VM host as root or with Docker access.
gui.docker-command=${GUI_DOCKER_COMMAND:docker}
gui.docker-network=${GUI_DOCKER_NETWORK:system-y-net}
gui.node-image=${GUI_NODE_IMAGE:node-img}
gui.node-container-prefix=${GUI_NODE_PREFIX:node-}
gui.node-data-dir=${GUI_NODE_DATA_DIR:./gui-data}
