spring.application.name=gui
server.port=8090

# Docker mode: override this with GUI_NAMING_SERVER_URL=http://naming-server:8080/api
# Host mode: default points to localhost:8080.
gui.naming-server-base-url=${GUI_NAMING_SERVER_URL:http://localhost:8080/api}
gui.node-api-port=${GUI_NODE_API_PORT:8080}

gui.docker-command=${GUI_DOCKER_COMMAND:docker}
gui.docker-network=${GUI_DOCKER_NETWORK:system-y-net}
gui.node-image=${GUI_NODE_IMAGE:node-img}
gui.node-container-prefix=${GUI_NODE_PREFIX:node-}
gui.nameserver-container-name=${GUI_NAMESERVER_CONTAINER_NAME:naming-server}
gui.nameserver-image=${GUI_NAMESERVER_IMAGE:naming-server-img}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
